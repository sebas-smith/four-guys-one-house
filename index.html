<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Four Guys One House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Public+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <span class="board">To Let · 4 bed</span>
    <h1>Four Guys One House</h1>
    <p class="brief">South-west London, from January 2027. Target £1,000 each (£4,000), max £1,200 each (£4,800), before bills.</p>
  </header>

  <div class="tabs" id="tabs" role="toolbar" aria-label="Filter by status"></div>
  <input class="search" id="search" type="search" placeholder="Search street or area" aria-label="Search street or area">
  <div class="list" id="list"><div class="empty"><strong>Loading listings…</strong></div></div>
  <p class="foot" id="foot"></p>
</div>
<script src="app.js"></script>
</body>
</html>
