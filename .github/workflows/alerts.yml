name: Ingest listing emails

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: listings
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Merge sweep files not merged yet
        continue-on-error: true
        # catches up a sweep run GitHub dropped from the queue; does nothing if all are merged
        run: python scripts/merge_sweep.py --pending --ids-out "$RUNNER_TEMP/added.txt"
      - name: Read inbox
        id: ingest
        continue-on-error: true
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/ingest_alerts.py
      - run: pip install curl_cffi
      - name: Read agent websites
        id: agents
        continue-on-error: true
        run: python scripts/agent_feeds.py
      - name: Nearest stations for new homes
        continue-on-error: true
        run: python scripts/stations.py
      - name: Commute times for new homes
        continue-on-error: true
        timeout-minutes: 20
        run: python scripts/commutes.py
      - name: Check homes a caught-up sweep added or flagged
        continue-on-error: true
        run: python scripts/check_live.py --ids "$(paste -sd, "$RUNNER_TEMP/added.txt" 2>/dev/null)"
      - name: Commit new listings
        run: |
          git config user.name "four-guys-bot"
          git config user.email "four-guys-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Add listings from alert emails and agent sites"
          for i in 1 2 3 4 5; do
            if git pull --rebase && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 15))
          done
          exit 1
      - name: Fail if an email couldn't be read
        if: steps.ingest.outcome == 'failure' || steps.agents.outcome == 'failure'
        run: exit 1
