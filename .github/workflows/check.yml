name: Check adverts are still live

on:
  schedule:
    - cron: "0 5 * * *"  # 05:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: listings
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi
      - name: Open every live advert
        run: python scripts/check_live.py
      - name: Commit
        run: |
          git config user.name "four-guys-bot"
          git config user.email "four-guys-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Mark let agreed and taken-down adverts"
          git pull --rebase
          git push
